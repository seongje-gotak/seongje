function editProfile(){theme(true);$('app').innerHTML=header('프로필 편집','','ig-profile')+`<form class="editor" id="profile-form"><label>이름<input name="name" value="${esc(profile.name)}" maxlength="30" required></label><label>사용자 이름<input name="handle" value="${esc(profile.handle)}" pattern="[A-Za-z0-9_.]+" maxlength="30" required></label><label>소개<textarea name="bio" maxlength="150" rows="4">${esc(profile.bio)}</textarea></label><button class="save">완료</button></form>`;$('profile-form').onsubmit=e=>{e.preventDefault();profile=Object.fromEntries(new FormData(e.target));save('profile',profile);instagram('profile')}}

function safari(){theme();$('app').innerHTML=header('Safari')+`<div class="scroll"><h2 style="margin:25px 20px 5px">즐겨찾기</h2><div class="favorites"><a href="https://www.google.com" target="_blank" rel="noopener noreferrer"><i>G</i>Google</a><a href="https://www.naver.com" target="_blank" rel="noopener noreferrer"><i style="color:#03c75a">N</i>NAVER</a><a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer"><img src="${ASSETS.insta}" style="width:60px;border-radius:14px" alt="">Instagram</a></div><p class="empty">웹사이트는 새 탭에서 열립니다.</p></div><form class="address" id="web-form"><input id="address" placeholder="검색 또는 웹사이트 이름" aria-label="웹 주소 또는 검색어"><button aria-label="이동">${icon('arrow')}</button></form>`;$('web-form').onsubmit=e=>{e.preventDefault();let q=$('address').value.trim();if(!q)return;let url=/^https?:\/\//i.test(q)?q:(!/\s/.test(q)&&q.includes('.')?'https://'+q:'https://www.google.com/search?q='+encodeURIComponent(q));if(/^https?:\/\//i.test(url))window.open(url,'_blank','noopener,noreferrer')}}
function spotify(){theme(true);$('app').style.background='linear-gradient(#163128,#121212 45%)';$('app').innerHTML=header('Spotify')+`<div class="scroll"><div class="spotify-cover">금성제의<br>플레이리스트</div><div class="music-player"><h2 id="track-name" style="font-size:20px">${esc(musicName||'내 음악')}</h2><p class="muted">기기에 있는 음악 파일을 선택해 재생하세요.</p><label class="file-label" for="audio-input">음악 파일 선택</label><input id="audio-input" type="file" accept="audio/*"><div id="audio-mount" style="margin-top:20px"></div></div></div>`;let audio=$('audio');audio.controls=true;$('audio-mount').append(audio);$('audio-input').onchange=e=>{const f=e.target.files[0];if(!f)return;if(musicURL)URL.revokeObjectURL(musicURL);musicURL=URL.createObjectURL(f);musicName=f.name.replace(/\.[^.]+$/,'');$('track-name').textContent=musicName;audio.src=musicURL;audio.play().catch(()=>toast('재생 버튼을 눌러 주세요.'))}}

let miniDraft={person:null,amount:''};
const won=n=>n.toLocaleString('ko-KR')+'원';
const miniPeople=[people[0],people[1]];
function miniFrame(content,dark=false){theme(dark);$('app').style.background=dark?'#26282f':'#fff';$('app').innerHTML=`<div class="kb-page ${dark?'kb-dark':''}">${content}</div>`}

  <span aria-label="프로필"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="9" r="5.2"/><path d="M5.3 27c.7-6.8 4.4-10 10.7-10s10 3.2 10.7 10z"/></svg></span>

function miniHome(){miniFrame(`<div class="kb-home-head"><b>금성제</b><span>내 계좌</span><i></i></div><section class="kb-account"><small>금성제의 통장 ★</small><strong>${won(mini.balance)}</strong><div class="kb-actions"><button data-action="mini-history">입출금내역</button><button data-action="mini-send">이체</button></div><div class="kb-safe"><span>세이프박스</span><strong>2,000,000원</strong></div></section>${bankNav()}`)}
function miniHistory(){miniFrame(`<div class="kb-history-top"><button data-action="mini-home">‹</button><b>금성제의 통장</b><span>⚙</span><small>3333-••••-0580</small><strong>${won(mini.balance)}</strong><div><button data-action="mini-send">이체하기</button><button disabled>채우기</button></div></div><div class="kb-history-tools"><span>⌕</span><b>3개월 · 전체 · 최신순⌄</b></div><div class="kb-history-list">${mini.history.map(x=>`<div class="kb-history-row"><time>${x.date}</time><div><b>${esc(x.name)}</b><small>${esc(x.tag)}</small></div><span><b>${x.amount<0?'-':'+'}${won(Math.abs(x.amount))}</b><small>${won(x.balance)}</small></span></div>`).join('')}</div>${bankNav()}`)}
function miniSend(){miniDraft={person:null,amount:''};miniFrame(`<div class="kb-transfer-head"><button data-action="mini-home">닫기</button><h1>이체</h1></div><div class="kb-search">⌕ <span>받는사람 이름 또는 계좌번호</span><button disabled>▣</button></div><div class="kb-tabs"><b>계좌번호</b><span>카카오톡 친구</span></div><h2 class="kb-recent-title">최근 이체</h2><div class="kb-recent">${miniPeople.map((p,i)=>`<button data-bank-person="${i}"><i>B</i><span><b>${p.name}</b><small>카카오뱅크 3333-••••-${i?'4172':'3073'}</small></span><strong>★</strong></button>`).join('')}</div>`)}
function miniAmount(){if(miniDraft.person===null)return miniSend();const p=miniPeople[miniDraft.person],amount=Number(miniDraft.amount||0);miniFrame(`<div class="kb-amount-head"><button data-action="mini-send">‹</button><div><b>${p.name}⌄</b><small>카카오뱅크 3333-••••-${miniDraft.person?'4172':'3073'}</small></div><button data-action="mini-send">취소</button></div><div class="kb-amount-value">${amount?won(amount):'<span>보낼금액</span>'}</div><div class="kb-source">금성제의 통장(0580): ${won(mini.balance)}⌄</div><div class="kb-quick">${[['10000','+1만'],['50000','+5만'],['100000','+10만'],['all','전액']].map(([v,t])=>`<button data-bank-quick="${v}">${t}</button>`).join('')}</div><div class="kb-keypad">${['1','2','3','4','5','6','7','8','9','00','0','del'].map(v=>`<button data-bank-digit="${v}">${v==='del'?'⌫':v}</button>`).join('')}</div><button class="kb-next" data-action="mini-confirm" ${amount>0&&amount<=mini.balance?'':'disabled'}>다음</button>`)}
function miniConfirm(){const amount=Number(miniDraft.amount||0);if(miniDraft.person===null||!Number.isSafeInteger(amount)||amount<=0||amount>mini.balance)return miniAmount();const p=miniPeople[miniDraft.person];miniFrame(`<div class="kb-amount-head"><button data-action="mini-amount">‹</button><div><b>${p.name}⌄</b><small>카카오뱅크 3333-••••-${miniDraft.person?'4172':'3073'}</small></div><button data-action="mini-send">취소</button></div><div class="kb-confirm-value">${won(amount)}</div><div class="kb-source">금성제의 통장(0580): ${won(mini.balance)}⌄</div><div class="kb-label"><span>받는 분에게 표기</span><b>금성제</b></div><div class="kb-label"><span>나에게 표기</span><small>미입력 시 수취인명</small></div><button class="kb-next active" data-action="mini-commit">다음</button>`)}
function miniCommit(){const amount=Number(miniDraft.amount||0),p=miniPeople[miniDraft.person];if(!p||!Number.isSafeInteger(amount)||amount<=0||amount>mini.balance)return miniAmount();const now=new Date(),date=`${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;mini.balance-=amount;mini.history.unshift({date,name:p.name,tag:'#이체',amount:-amount,balance:mini.balance});save('kbank-v2',mini);miniFrame(`<div class="kb-done"><i>✓</i><h2>${p.name}님에게<br>${won(amount)} 이체 완료</h2><small>이 휴대폰 안의 가상 거래입니다.</small><button data-action="mini-home">확인</button></div>`)}

// Keep the local audio element alive when moving between apps.
const originalHome=home, originalOpen=openApp;
home=function(){const a=$('audio');if(a)document.body.append(a);originalHome()};openApp=function(k){const a=$('audio');if(a)document.body.append(a);originalOpen(k)};
const actions={'kakao-close':home,'kakao-profile':kakaoProfile,'kakao-photo':kakaoPhoto,'mini-home':miniHome,'mini-history':miniHistory,'mini-send':miniSend,'mini-amount':miniAmount,'mini-confirm':miniConfirm,'mini-commit':miniCommit,'friends':()=>chatList('kakao',true),'chats':()=>chatList(),'messages':()=>chatList('msg'),'photo-all':()=>gallery(),'photo-fav':()=>gallery(true),'photo-back':()=>photoReturn==='insta'?instagram():gallery(),'ig-home':()=>instagram(),'ig-search':()=>instagram('search'),'ig-profile':()=>instagram('profile'),'ig-saved':()=>instagram('saved'),'ig-edit':editProfile,'ig-dm':igDM,'phone-contacts':()=>phone('contacts'),'phone-keys':()=>phone('keys'),'dial-delete':()=>{dial=dial.slice(0,-1);phone('keys')},'dial-call':()=>dial?call(dial):toast('번호를 입력해 주세요.')};
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.profile!==undefined){kakaoProfile(+d.profile)}else if(d.bankPerson!==undefined){miniDraft={person:+d.bankPerson,amount:''};miniAmount()}else if(d.bankQuick!==undefined){let add=d.bankQuick==='all'?mini.balance:Number(d.bankQuick);miniDraft.amount=String(Math.min(mini.balance,Number(miniDraft.amount||0)+add));miniAmount()}else if(d.bankDigit!==undefined){miniDraft.amount=d.bankDigit==='del'?miniDraft.amount.slice(0,-1):String(Math.min(mini.balance,Number((miniDraft.amount+d.bankDigit).slice(0,10))));miniAmount()}else if(d.app)openApp(d.app);else if(d.action)actions[d.action]?.();else if(d.room!==undefined)room(+d.room,d.type);else if(d.photo!==undefined)viewPhoto(+d.photo,current==='insta'?'insta':'photo');else if(d.view!==undefined)viewPhoto(+d.view,photoReturn);else if(d.favorite!==undefined){favorites[d.favorite]=!favorites[d.favorite];save('favorites',favorites);viewPhoto(+d.favorite,photoReturn)}else if(d.like!==undefined){likes[d.like]=!likes[d.like];save('likes',likes);const scroll=$('app').querySelector('.scroll').scrollTop;instagram(igTab);$('app').querySelector('.scroll').scrollTop=scroll}else if(d.save!==undefined){saved[d.save]=!saved[d.save];save('saved',saved);const scroll=$('app').querySelector('.scroll').scrollTop;instagram(igTab);$('app').querySelector('.scroll').scrollTop=scroll}else if(d.comment!==undefined)commentView(+d.comment);else if(d.story!==undefined)viewPhoto(posts[+d.story].photo,'insta');else if(d.key){if(dial.length<20)dial+=d.key;$('dial-number').textContent=dial}else if(d.call!==undefined)call(people[+d.call].name)});
